<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Aurea Hosting share image, 1200 by 630</title>
<!-- Source for next/images/og-cover.jpg. Open at a 1200 by 630 viewport, screenshot, export as JPEG with no metadata. Fonts and tokens are the site own. -->
<style>
  @font-face { font-family: "Switzer"; src: url("../next/assets/fonts/Switzer-Semibold.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Switzer"; src: url("../next/assets/fonts/Switzer-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Satoshi"; src: url("../next/assets/fonts/Satoshi-Medium.woff2") format("woff2"); font-weight: 500; }
  :root { --wheat: #f3e9d7; --ink: #172226; --ink-2: #3a4a50; --gold: #c8a35d; --brass: #7a5c22; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: var(--wheat); overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; padding: 72px 80px 84px; background: var(--wheat); color: var(--ink); display: flex; flex-direction: column; justify-content: space-between; }
  .wordmark { font-family: "Switzer", Arial, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; }
  .kick { display: flex; align-items: center; gap: 18px; font-family: "Satoshi", Arial, sans-serif; font-weight: 500; font-size: 28px; color: var(--ink-2); margin-bottom: 30px; }
  .kick::before { content: ""; width: 48px; height: 3px; background: var(--gold); }
  h1 { font-family: "Switzer", Arial, sans-serif; font-weight: 600; font-size: 104px; line-height: 1.02; letter-spacing: -0.035em; }
  h1 span { display: block; }
  h1 span + span { color: var(--brass); font-weight: 500; letter-spacing: -0.03em; }
</style>
</head>
<body>
<div class="card">
  <div class="wordmark">Aurea Hosting</div>
  <div>
    <p class="kick">Short stay management, Adelaide</p>
    <h1><span>We manage fewer properties.</span><span>On purpose.</span></h1>
  </div>
</div>
</body>
</html>
